name: Deploy

# A tag push (made by release.yml) deploys to beta. Production follows automatically only when the diff
# touches migrations/ or infra/; otherwise promote.yml ships it (ADR-0020, docs/versioning.md).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # The deploy token lives in this environment, which only main and v* tags can use.
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history and tags, to diff this tag against the previous one.
          fetch-depth: 0
      - uses: $/.github/actions/setup-node-pnpm
      - run: pnpm run html:build
      - run: pnpm run tailwind:build
      # wrangler deploy never applies D1 migrations. They run once, before either deploy, because beta and production
      # share the database (ADR-0020). The restore point is logged first (docs/versioning.md, Database migrations).
      - name: Record D1 restore point before migrating
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_TOKEN }}
        run: pnpm exec wrangler d1 time-travel info climbing-logbook
      - name: Apply D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_TOKEN }}
        run: pnpm exec wrangler d1 migrations apply climbing-logbook --remote
      # workflow_dispatch is a manual override that deploys production only.
      - name: Determine deploy classification
        id: classify
        if: github.event_name == 'push'
        run: |
          CURRENT_TAG="$GITHUB_REF_NAME"
          PREV_TAG=$(git tag -l 'v*' --sort=-v:refname | grep -A1 "^${CURRENT_TAG}$" | tail -1)
          if [ -z "$PREV_TAG" ] || [ "$PREV_TAG" = "$CURRENT_TAG" ]; then
            echo "No previous tag found -- treating as direct (deploys to both beta and production)."
            echo "direct=true" >> "$GITHUB_OUTPUT"
          else
            echo "previous_tag=$PREV_TAG" >> "$GITHUB_OUTPUT"
            CHANGED=$(git diff --name-only "$PREV_TAG" "$CURRENT_TAG" -- migrations/ infra/)
            if [ -n "$CHANGED" ]; then
              echo "Diff since $PREV_TAG touches migrations/ or infra/ -- direct (both beta and production):"
              echo "$CHANGED"
              echo "direct=true" >> "$GITHUB_OUTPUT"
            else
              echo "Diff since $PREV_TAG touches neither migrations/ nor infra/ -- beta only."
              echo "direct=false" >> "$GITHUB_OUTPUT"
            fi
          fi
      # CLOUDFLARE_ENV selects the environment at build time; deploy:build refuses to run without it,
      # and wrangler checks --env=beta against it.
      - name: Deploy to beta
        id: deploy_beta
        if: github.event_name == 'push'
        run: pnpm run deploy:build && pnpm exec wrangler deploy --env=beta --tag "$(git describe --tags --exact-match HEAD 2>/dev/null || git rev-parse --short HEAD)"
        env:
          CLOUDFLARE_ENV: beta
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_TOKEN }}
      # --env="" pins deploy-time validation to env.production.
      - name: Deploy to production
        id: deploy_production
        if: github.event_name == 'workflow_dispatch' || steps.classify.outputs.direct == 'true'
        run: pnpm run deploy:build && pnpm exec wrangler deploy --env="" --tag "$(git describe --tags --exact-match HEAD 2>/dev/null || git rev-parse --short HEAD)"
        env:
          CLOUDFLARE_ENV: production
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_TOKEN }}
      - name: Re-seed the demo accounts if their seed changed
        if: steps.classify.outputs.previous_tag != ''
        env:
          PREVIOUS_TAG: ${{ steps.classify.outputs.previous_tag }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_TOKEN }}
        run: |
          if git diff --quiet "$PREVIOUS_TAG" "$GITHUB_REF_NAME" -- scripts/seed-demo-accounts.mjs shared/demo-personas.js shared/grade-data.js shared/health-consent.js server/lib/hardest-beta.js; then
            echo "Demo seed unchanged since $PREVIOUS_TAG."
          else
            node scripts/seed-demo-accounts.mjs --remote
          fi
      - name: Version for the deploy notices
        id: version
        if: always()
        run: echo "version=$(git describe --tags --exact-match HEAD 2>/dev/null || git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - name: Tell Discord about beta
        if: always() && steps.deploy_beta.outcome != 'skipped' && steps.deploy_beta.outcome != ''
        uses: $/.github/actions/notify-deploy
        with:
          webhook: ${{ secrets.DISCORD_DEPLOYS_WEBHOOK }}
          environment: beta
          version: ${{ steps.version.outputs.version }}
          outcome: ${{ steps.deploy_beta.outcome }}
      - name: Tell Discord about production
        if: always() && steps.deploy_production.outcome != 'skipped' && steps.deploy_production.outcome != ''
        uses: $/.github/actions/notify-deploy
        with:
          webhook: ${{ secrets.DISCORD_DEPLOYS_WEBHOOK }}
          environment: production
          version: ${{ steps.version.outputs.version }}
          outcome: ${{ steps.deploy_production.outcome }}
