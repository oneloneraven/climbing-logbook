name: Promote to production

# Deploys a chosen, already-tagged commit to production only (ADR-0020). Tags are cumulative snapshots of main,
# so promoting the latest tag includes everything beta has accumulated.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to promote (defaults to the latest tag if left blank)"
        required: false
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history and tags, to resolve the latest tag and check out an earlier one.
          fetch-depth: 0
      - name: Resolve tag to promote
        id: resolve
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [ -z "$TAG" ]; then
            TAG=$(git tag -l 'v*' --sort=-v:refname | head -1)
            echo "No tag input given -- resolved to latest: $TAG"
          fi
          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "::error::Tag '$TAG' does not exist in this repository."
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - run: git checkout "$TAG"
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
      - uses: $/.github/actions/setup-node-pnpm
      - run: pnpm run html:build
      - run: pnpm run tailwind:build
      # Idempotent, and beta and production share the database (ADR-0020). The restore point is logged first
      # (docs/versioning.md, Database migrations).
      - name: Record D1 restore point before migrating
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_TOKEN }}
        run: pnpm exec wrangler d1 time-travel info climbing-logbook
      - name: Apply D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_TOKEN }}
        run: pnpm exec wrangler d1 migrations apply climbing-logbook --remote
      # CLOUDFLARE_ENV selects the environment at build time; deploy:build refuses to run without it,
      # and --env="" pins deploy-time validation to env.production.
      - name: Deploy to production
        id: deploy_production
        run: pnpm run deploy:build && pnpm exec wrangler deploy --env="" --tag "$TAG"
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
          CLOUDFLARE_ENV: production
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_TOKEN }}
      - name: Tell Discord
        if: always() && steps.deploy_production.outcome != 'skipped' && steps.deploy_production.outcome != ''
        uses: $/.github/actions/notify-deploy
        with:
          webhook: ${{ secrets.DISCORD_DEPLOYS_WEBHOOK }}
          environment: production
          version: ${{ steps.resolve.outputs.tag }}
          outcome: ${{ steps.deploy_production.outcome }}
