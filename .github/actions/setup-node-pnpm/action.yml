name: Set up pnpm + Node + install
description: >
  pnpm/action-setup + actions/setup-node (Node from package.json, pnpm cache) +
  pnpm install --frozen-lockfile -- the identical post-checkout setup
  every workflow that runs this project's JS toolchain needs. Checkout
  itself deliberately stays out of this composite action and in each
  calling workflow instead -- release.yml's checkout needs a specific
  ref, fetch-depth, and PAT token (#197) that the other workflows don't,
  so it can't be folded into a one-size-fits-all step here.
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: package.json
        cache: pnpm
        # setup-node would otherwise enable its own cache because package.json has packageManager; cache: pnpm is explicit.
        package-manager-cache: false
        registry-url: https://npm.pkg.github.com
        scope: '@ravendarque'
    - run: pnpm install --frozen-lockfile
      shell: bash
      env:
        NODE_AUTH_TOKEN: ${{ github.token }}
