name: Test

# A required check: the trigger stays unconditional, since a required check that never runs blocks the PR.
on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read
  # The paths filter lists a pull request's changed files.
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-26.04
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
      e2e: ${{ steps.filter.outputs.e2e }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          # Everything counts except docs and infra, so a new build input can't slip past.
          predicate-quantifier: every
          filters: |
            relevant: &relevant
              - '!docs/**'
              - '!*.md'
              - '!infra/**'
            e2e:
              - *relevant
              # Help pages are Markdown content; the test job builds them, and no e2e test reads them.
              - '!views/help/**/*.md'

  lint:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-node-pnpm
      - run: pnpm lint

  typecheck:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-node-pnpm
      - run: pnpm typecheck

  test:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-node-pnpm
      # The ASSETS binding the tests hit serves the 11ty output.
      - run: pnpm run html:build
      - run: pnpm test:coverage
      - name: Coverage summary
        if: ${{ !cancelled() && hashFiles('coverage/coverage-summary.json') != '' }}
        run: |
          node -e '
            const summary = require("./coverage/coverage-summary.json");
            const dirs = {};
            for (const [file, m] of Object.entries(summary)) {
              if (file === "total") continue;
              const dir = file.slice(process.cwd().length + 1).split("/")[0];
              dirs[dir] ??= { statements: [0, 0], branches: [0, 0], functions: [0, 0], lines: [0, 0] };
              for (const k in dirs[dir]) { dirs[dir][k][0] += m[k].covered; dirs[dir][k][1] += m[k].total; }
            }
            const pct = ([c, t]) => (t ? ((100 * c) / t).toFixed(1) : "100.0") + "%";
            const rows = Object.entries(dirs).map(([d, m]) => `| ${d}/ | ${pct(m.statements)} | ${pct(m.branches)} | ${pct(m.functions)} | ${pct(m.lines)} |`);
            console.log(["| | Statements | Branches | Functions | Lines |", "|---|---|---|---|---|", ...rows].join("\n"));
          ' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && hashFiles('coverage/coverage-summary.json') != '' }}
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14
      - run: pnpm run tailwind:build
      - run: pnpm run deploy:build
        env:
          CLOUDFLARE_ENV: preview

  # After the quick checks, so a push that fails them doesn't run both browsers in full.
  e2e-browser:
    needs: [changes, lint, typecheck]
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-node-pnpm
      # Cloudflare's public always-passes Turnstile test secret, not a credential.
      - run: echo 'TURNSTILE_SECRET_KEY=1x0000000000000000000000000000000AA' >> .dev.vars
      # A test-only value: e2e setup signs its seeded users' session cookies with it.
      - run: echo 'BETTER_AUTH_SECRET=e2e-only-secret-not-used-anywhere-else-0000' >> .dev.vars
      - run: pnpm run test:e2e
        env:
          E2E_BROWSERS: ${{ matrix.browser }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: webdriverio-screenshots-${{ matrix.browser }}
          path: test-results/wdio/
          retention-days: 7

  # The required check: one name for the ruleset, whichever browsers run.
  e2e:
    needs: [changes, e2e-browser]
    if: always()
    runs-on: ubuntu-26.04
    steps:
      - if: needs.changes.result != 'success'
        run: echo "::error::The path filter failed." && exit 1
      - if: needs.changes.outputs.e2e == 'true' && needs.e2e-browser.result == 'skipped'
        run: echo "::error::Not run, because lint or typecheck failed." && exit 1
      - if: needs.changes.outputs.e2e == 'true' && needs.e2e-browser.result != 'success' && needs.e2e-browser.result != 'skipped'
        run: echo "::error::The e2e tests failed in at least one browser." && exit 1
