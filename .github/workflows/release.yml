name: Release

# Only a tag is pushed, never a commit to main (docs/versioning.md).
on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type (see docs/versioning.md for what qualifies)"
        required: true
        type: choice
        options: [patch, minor, major]
        default: patch

# Serialised so each run computes the next version from the real latest tag.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Every merged PR runs this: a run tags every released PR since the latest tag, so one cancelled while waiting loses nothing.
  release:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      pull-requests: read
    steps:
      # The PR's own merge commit, not main's tip: a PR merged moments later would otherwise get this tag too.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || 'main' }}
          fetch-depth: 0
          persist-credentials: false

      - name: Plan the tags
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          BUMP_INPUT: ${{ inputs.bump }}
        run: |
          node scripts/plan-releases.mjs > "$RUNNER_TEMP/plan.json"
          cat "$RUNNER_TEMP/plan.json"
          echo "count=$(jq length "$RUNNER_TEMP/plan.json")" >> "$GITHUB_OUTPUT"

      # A tag pushed with GITHUB_TOKEN doesn't trigger deploy.yml, so the App's token is minted now, for git push alone.
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        if: steps.plan.outputs.count != '0'
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-workflows: write

      - name: Create and push the tags, oldest first
        if: steps.plan.outputs.count != '0'
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          jq -c '.[]' "$RUNNER_TEMP/plan.json" | while read -r release; do
            version=$(jq -r .version <<< "$release")
            jq -r .message <<< "$release" > "$RUNNER_TEMP/tag-message"
            git tag -a "$version" --cleanup=whitespace -F "$RUNNER_TEMP/tag-message" "$(jq -r .sha <<< "$release")"
            git push "https://x-access-token:${APP_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$version"
            # Nothing reads GitHub Releases, so one that fails mustn't stop the remaining tags.
            gh release create "$version" --repo "$GITHUB_REPOSITORY" --title "$version" --generate-notes \
              || echo "::warning::Tag $version pushed, but its GitHub Release wasn't created."
          done
