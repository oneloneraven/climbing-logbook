version: 2
updates:
  # Covers pnpm-lock.yaml -- Dependabot's "npm" ecosystem type supports
  # npm/yarn/pnpm lockfiles, there's no separate "pnpm" type.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "release: patch"
    cooldown:
      default-days: 3
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "release: none"
    cooldown:
      default-days: 3
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
