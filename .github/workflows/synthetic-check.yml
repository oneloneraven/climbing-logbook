name: Synthetic production check

# The e2e suite only sees PR previews (ADR-0011). Account set-up: infra/README.md, Synthetic monitoring account.
on:
  # Runs repo code from main and reads nothing from the triggering run.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: [Deploy]
    types: [completed]
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    # Only check after a successful Deploy; a failed one is already loud.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Nothing to install, so setup-node-pnpm is skipped.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: node scripts/synthetic-check.mjs
        env:
          SYNTHETIC_USER_EMAIL: ${{ secrets.SYNTHETIC_USER_EMAIL }}
          SYNTHETIC_USER_PASSWORD: ${{ secrets.SYNTHETIC_USER_PASSWORD }}

  # Deploy-triggered failures only. The previous run's conclusion comes from run history, so there is no counter to keep.
  notify-on-repeated-failure:
    needs: check
    if: github.event_name == 'workflow_run' && needs.check.result == 'failure'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Reads its own previous run, and opens an issue when production fails.
      actions: read
      issues: write
    steps:
      - name: Check whether the previous Deploy-triggered run also failed
        id: history
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # --status completed skips this unfinished run; --workflow needs the filename, as gh run list doesn't match the name.
          PREVIOUS=$(gh run list --repo "${{ github.repository }}" --workflow synthetic-check.yml --event workflow_run --status completed --limit 1 --json conclusion --jq '.[0].conclusion // empty')
          echo "previous=$PREVIOUS" >> "$GITHUB_OUTPUT"

      - name: File a single issue -- two consecutive real-deploy failures, not one scheduled blip
        if: steps.history.outputs.previous == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          printf '%s\n\n%s\n\n%s\n' \
            "The post-deploy synthetic check has now failed on two consecutive real deploys, not a single scheduled blip -- see this run: $RUN_URL" \
            "A previously-known-good tag can be redeployed via promote.yml's own \`workflow_dispatch\` (defaults to the latest tag; pass a specific earlier one instead if that's not the right target)." \
            "Filed automatically by \`notify-on-repeated-failure\` in synthetic-check.yml -- see #891 for why this notifies rather than auto-promoting." \
            > issue-body.md
          gh issue create --repo "${{ github.repository }}" \
            --title "Synthetic check failed on two consecutive deploys -- production may be broken" \
            --label bug \
            --body-file issue-body.md
