name: Sync Worker secrets

# Sets the Worker secrets from the production environment's secrets, without ever printing them (docs/infra-architecture.md, "Secrets and variables").
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: sync-worker-secrets
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-node-pnpm
      - name: Set OWNER_EMAIL on the Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
        run: |
          set -euo pipefail
          if [ -z "$OWNER_EMAIL" ]; then
            echo "::error::OWNER_EMAIL is empty: set it as a secret of the production environment first"
            exit 1
          fi
          printf '%s' "$OWNER_EMAIL" | pnpm exec wrangler secret put OWNER_EMAIL --env production
      - name: Set TURNSTILE_SECRET_KEY on the Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$TURNSTILE_SECRET_KEY" ]; then
            echo "::error::TURNSTILE_SECRET_KEY is empty: set it as a secret of the production environment first"
            exit 1
          fi
          printf '%s' "$TURNSTILE_SECRET_KEY" | pnpm exec wrangler secret put TURNSTILE_SECRET_KEY --env production
          printf '%s' "$TURNSTILE_SECRET_KEY" | pnpm exec wrangler secret put TURNSTILE_SECRET_KEY --env beta
      - name: Set ACCOUNT_SECRET_CL on the Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          ACCOUNT_SECRET_CL: ${{ secrets.ACCOUNT_SECRET_CL }}
        run: |
          set -euo pipefail
          if [ -z "$ACCOUNT_SECRET_CL" ]; then
            echo "::error::ACCOUNT_SECRET_CL is empty: set it as a secret of the production environment first"
            exit 1
          fi
          printf '%s' "$ACCOUNT_SECRET_CL" | pnpm exec wrangler secret put ACCOUNT_SECRET_CL --env production
          printf '%s' "$ACCOUNT_SECRET_CL" | pnpm exec wrangler secret put ACCOUNT_SECRET_CL --env beta
      - name: Set USAGE_SERVICE_TOKENS on the Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          USAGE_SERVICE_TOKENS: ${{ secrets.USAGE_SERVICE_TOKENS }}
        run: |
          set -euo pipefail
          if [ -z "$USAGE_SERVICE_TOKENS" ]; then
            echo "::notice::USAGE_SERVICE_TOKENS is empty: removing it from the Worker, so no service token can read usage"
            if pnpm exec wrangler secret list --env production --format json | jq -e 'any(.[]; .name == "USAGE_SERVICE_TOKENS")' > /dev/null; then
              pnpm exec wrangler secret delete USAGE_SERVICE_TOKENS --env production
            fi
            exit 0
          fi
          printf '%s' "$USAGE_SERVICE_TOKENS" | pnpm exec wrangler secret put USAGE_SERVICE_TOKENS --env production
